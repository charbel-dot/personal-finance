# Tiny companion Worker: Pages Functions can't run Cron Triggers, so this Worker
# shares the same R2 bucket and the same reconcile code (server/data.ts).
name = "money-app-cron"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = false
preview_urls = false

[triggers]
crons = ["15 * * * *"]

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "money-app-data"

[env.dev]
name = "money-app-cron-dev"
[env.dev.triggers]
crons = ["15 * * * *"]
[[env.dev.r2_buckets]]
binding = "BUCKET"
bucket_name = "money-app-data-dev"
